# Gli altri 8 reattori (Sizewell B sta in sizewell-b.yaml)
# Fonte principale: wna-db (World Nuclear Association Reactor Database), T2.
# Il rendimento non è mai dichiarato dalla fonte: è DERIVATO come
#   capacita_netta / capacita_termica
# quindi va confrontato con la potenza che il sito stesso dichiara (netta o lorda).

verificato_il: 2026-08-02
fonte_dati: wna-db

# =====================================================================
magnox:
  impianto: Calder Hall 1
  dati_fonte:
    citazione: "Capacity Gross: 60 MWe ... Capacity Net: 49 MWe ... Thermal Capacity: 268 MWt ... Construction Start: Saturday, 1 August 1953 ... Commercial Operation: Monday, 1 October 1956 ... Permanent Shutdown: Monday, 31 March 2003"
  affermazioni:
    - {id: magnox.avvio_costruzione, sito: "1953", stato: sostenuta}
    - {id: magnox.esercizio_dal, sito: "1956", stato: sostenuta}
    - {id: magnox.tempo_costruzione, sito: "≈ 3 anni", calcolo: "ago 1953 → ott 1956 = 3,2 anni", stato: sostenuta}
    - {id: magnox.potenza, sito: "≈ 50 MW", fonte: "49 MWe netti", stato: sostenuta}
    - {id: magnox.chiusura, sito: "2003", stato: sostenuta}
    - {id: magnox.durata, sito: "47 anni", calcolo: "1956 → 2003 = 47", stato: sostenuta}
    - id: magnox.rendimento
      sito: "≈ 20 %"
      calcolo: "49 / 268 = 18,3 % (lordo 60/268 = 22,4 %)"
      stato: parziale
      correzione_applicata: "≈ 18 %"
      nota: "La potenza dichiarata dal sito è quella netta, quindi il rendimento va calcolato sul netto."

# =====================================================================
rbmk:
  impianto: "Chernobyl (scheda riferita alle unità 3–4, ma le date sono dell'unità 1)"
  dati_fonte:
    unita_1:
      citazione: "Construction Start: Sunday, 1 March 1970 ... First Grid Connection: Monday, 26 September 1977 ... Commercial Operation: Saturday, 27 May 1978"
    unita_4:
      citazione: "Capacity Gross: 1000 MWe ... Capacity Net: 925 MWe ... Thermal Capacity: 3200 MWt ... Construction Start: Sunday, 1 April 1979 ... Commercial Operation: Monday, 26 March 1984"
  affermazioni:
    - id: rbmk.avvio_costruzione
      sito: "1972 (unità 1)"
      fonte: "1 marzo 1970"
      stato: contraddetta
      correzione_applicata: "1970 (unità 1)"
    - {id: rbmk.esercizio_dal, sito: "1977", fonte: "primo parallelo 26 set 1977", stato: sostenuta}
    - {id: rbmk.tempo_costruzione, sito: "≈ 5 anni per unità", calcolo: "unità 4: apr 1979 → mar 1984 = 5,0", stato: sostenuta}
    - {id: rbmk.potenza, sito: "1 000 MW", fonte: "1000 MWe lordi", stato: sostenuta}
    - id: rbmk.rendimento
      sito: "≈ 31 %"
      calcolo: "1000 / 3200 = 31,25 % (lordo, coerente con la potenza dichiarata)"
      stato: sostenuta
  nota_struttura: >
    La scheda si intitola "unità 3–4" ma avvio costruzione ed entrata in
    esercizio sono dell'unità 1. Ambiguità segnalata, non corretta: è una
    scelta editoriale (raccontare la filiera o la singola unità).

