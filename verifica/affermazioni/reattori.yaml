htrpm:
  impianto: Shidaowan HTR-PM
  fonte_dati: wnn-htrpm-2023
  attenzione: >
    Nel database WNA la voce "Shidaowan 1" è un Hualong One in costruzione
    dal 2024: è un altro impianto sullo stesso sito, NON l'HTR-PM.
    Trappola in cui è facile cadere.
  dati_fonte:
    citazione: "The HTR-PM features two small reactors (each of 250 MWt) that drive a single 210 MWe steam turbine."
  affermazioni:
    - {id: htrpm.avvio_costruzione, sito: "9 dicembre 2012", fonte: "First concrete ... December 2012", stato: parziale, nota: "mese e anno confermati, il giorno esatto no"}
    - {id: htrpm.esercizio_dal, sito: "6 dicembre 2023", stato: sostenuta}
    - {id: htrpm.tempo_costruzione, sito: "≈ 11 anni", calcolo: "dic 2012 → dic 2023 = 11,0", stato: sostenuta}
    - {id: htrpm.potenza, sito: "210 MW", stato: sostenuta}
    - {id: htrpm.configurazione, sito: "due reattori da 250 MW termici che alimentano una sola turbina", stato: sostenuta, nota: "corrisponde alla lettera"}
    - id: htrpm.rendimento
      sito: "≈ 40 %"
      calcolo: "210 / 500 = 42,0 %"
      stato: parziale
      correzione_applicata: nessuna
      nota: "Scarto 2 punti. Lasciato: con 'circa' regge, e il 42 % andrebbe confermato su fonte di progetto."
