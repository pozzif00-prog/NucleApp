# =====================================================================
candu:
  impianto: Darlington 1
  dati_fonte:
    citazione: "Capacity Gross: 934 MWe ... Capacity Net: 878 MWe ... Thermal Capacity: 2776 MWt ... Construction Start: Thursday, 1 April 1982 ... First Grid Connection: Wednesday, 19 December 1990 ... Commercial Operation: Saturday, 14 November 1992"
  affermazioni:
    - id: candu.avvio_costruzione
      sito: "1981"
      fonte: "1 aprile 1982"
      stato: contraddetta
      correzione_applicata: "1982"
    - id: candu.esercizio_dal
      sito: "1990"
      stato: parziale
      nota: >
        1990 è il primo parallelo in rete; l'esercizio commerciale è del 1992.
        Non corretto perché con "1990" il tempo di costruzione dichiarato
        (≈ 9 anni) resta coerente. Da decidere in redazione quale definizione
        usare in tutto il sito.
    - {id: candu.tempo_costruzione, sito: "≈ 9 anni", calcolo: "apr 1982 → dic 1990 = 8,7 (in rete) / 10,6 (commerciale)", stato: sostenuta}
    - {id: candu.potenza_unita, sito: "≈ 880 MW", fonte: "878 MWe", stato: sostenuta}
    - id: candu.rendimento
      sito: "≈ 30 %"
      calcolo: "878 / 2776 = 31,6 %"
      stato: parziale
      correzione_applicata: "≈ 32 %"

# =====================================================================
epr:
  impianto: Olkiluoto 3
  dati_fonte:
    citazione: "Capacity Gross: 1660 MWe ... Capacity Net: 1575 MWe ... Thermal Capacity: 4300 MWt ... Construction Start: Friday, 12 August 2005 ... Commercial Operation: Sunday, 16 April 2023"
  affermazioni:
    - {id: epr.avvio_costruzione, sito: "12 agosto 2005", stato: sostenuta, nota: "data esatta confermata"}
    - {id: epr.esercizio_dal, sito: "aprile 2023", fonte: "16 aprile 2023", stato: sostenuta}
    - {id: epr.tempo_costruzione, sito: "≈ 18 anni", calcolo: "ago 2005 → apr 2023 = 17,7", stato: sostenuta}
    - {id: epr.potenza_termica, sito: "4 300 MW", stato: sostenuta}
    - {id: epr.rendimento, sito: "≈ 37 %", calcolo: "1575 / 4300 = 36,6 %", stato: sostenuta}
    - id: epr.potenza_netta
      sito: "1 600 MW"
      fonte: "1575 MWe netti (1660 lordi)"
      stato: parziale
      correzione_applicata: "≈ 1 575 MW"
      nota: "Era dichiarata come valore esatto, non approssimato."
    - id: epr.superlativo
      sito: "Il reattore più potente in esercizio al mondo"
      stato: contraddetta
      controprova:
        fonte: wna-db-taishan-1
        citazione: "Model: EPR-1750 ... Capacity Gross: 1750 MWe ... Capacity Net: 1660 MWe ... Commercial Operation: Thursday, 13 December 2018 ... Status: Operable"
      correzione_applicata: "Uno dei reattori più potenti al mondo"
      nota: >
        Taishan 1 e 2 (Cina) hanno 1660 MWe netti contro 1575, e sono in
        esercizio dal 2018, cinque anni prima di Olkiluoto 3.
        Ho evitato di sostituire con "il più potente d'Europa" perché
        Flamanville 3 è dello stesso ordine e andrebbe verificato a parte.

